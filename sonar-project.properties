sonar.projectKey=Phalcode_gamevault-frontend
sonar.organization=phalcode
sonar.sources=src

# The OpenAPI-generated API client, build-time generated code and the Tauri
# (Rust) shell are not part of the JS/TS code quality analysis.
sonar.exclusions=src/api/**,src/generated/**,src-tauri/**,**/vite-env.d.ts

# Frontend coverage report produced by vitest (lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
