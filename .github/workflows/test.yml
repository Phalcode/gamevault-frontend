name: Test

on:
  pull_request:
    branches: [develop, master]
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve API spec hash
        id: api-spec
        shell: bash
        run: |
          SPEC_FILE="$RUNNER_TEMP/api-spec.yaml"
          # The spec host is a single external instance, so a gateway hiccup
          # (502/503) must not fail the whole job. Retry before giving up.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            "${{ vars.GV_API_SPEC_URL || 'https://gamevault.alfagun74.de/api/docs-yaml' }}" -o "$SPEC_FILE"
          echo "hash=$(sha256sum "$SPEC_FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "file=$SPEC_FILE" >> "$GITHUB_OUTPUT"

      - name: Cache generated API client
        uses: actions/cache@v6
        with:
          path: src/api
          key: api-${{ steps.api-spec.outputs.hash }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        env:
          GV_API_SPEC_PATH: ${{ steps.api-spec.outputs.file }}
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Run tests with coverage
        run: pnpm test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  rust:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        timeout-minutes: 15
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          version: "1-${{ env.ImageVersion }}"
          execute_install_scripts: true
          packages: >-
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            patchelf

      # `cache-apt-pkgs-action` reports success even when apt could not fetch
      # everything (a mirror lagging behind the archive is enough), which then
      # surfaces as a confusing `glib-sys` failure in the Rust build. Verify
      # the headers are really there and install them directly if not.
      - name: Verify Linux build dependencies
        shell: bash
        run: |
          required=(glib-2.0 gtk+-3.0 webkit2gtk-4.1)
          if pkg-config --exists "${required[@]}"; then
            exit 0
          fi
          echo "::warning::The APT cache did not provide the GTK/WebKit development packages, installing them directly."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          pkg-config --exists "${required[@]}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked
