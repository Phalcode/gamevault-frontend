name: Deploy

on:
  push:
    branches:
      - master
      - develop
      - early-access
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.current-version }}
      build_version: ${{ steps.build-info.outputs.build_version }}
      build_channel: ${{ steps.build-info.outputs.build_channel }}
      build_commit: ${{ steps.build-info.outputs.build_commit }}
      build_id: ${{ steps.build-info.outputs.build_id }}
      release_ref: ${{ steps.build-info.outputs.release_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Current Package Version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Compute build metadata
        id: build-info
        env:
          GV_BUILD_CHANNEL: ${{ github.ref == 'refs/heads/master' && 'stable' || github.ref == 'refs/heads/develop' && 'unstable' || 'early-access' }}
        run: node scripts/compute-build-info.mjs package.json

      - name: Resolve API spec hash
        id: api-spec
        shell: bash
        run: |
          SPEC_FILE="$RUNNER_TEMP/api-spec.yaml"
          curl -fsSL "${{ vars.GV_API_SPEC_URL || 'https://gamevault.alfagun74.de/api/docs-yaml' }}" -o "$SPEC_FILE"
          echo "hash=$(sha256sum "$SPEC_FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "file=$SPEC_FILE" >> "$GITHUB_OUTPUT"

      - name: Cache generated API client
        uses: actions/cache@v4
        with:
          path: src/api
          key: api-${{ steps.api-spec.outputs.hash }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        env:
          GV_API_SPEC_PATH: ${{ steps.api-spec.outputs.file }}
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Build
        env:
          GV_BUILD_VERSION: ${{ steps.build-info.outputs.build_version }}
          GV_BUILD_CHANNEL: ${{ steps.build-info.outputs.build_channel }}
          GV_BUILD_COMMIT: ${{ steps.build-info.outputs.build_commit }}
          GV_BUILD_ID: ${{ steps.build-info.outputs.build_id }}
          GV_RELEASE_REF: ${{ steps.build-info.outputs.release_ref }}
        run: pnpm run build

      - name: Zip dist folder
        run: zip -r gamevault-frontend.zip dist

      - name: Create Github Tag & Release
        id: release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package-version.outputs.current-version }}
          name: Version ${{ steps.package-version.outputs.current-version }}
          generate_release_notes: true
          files: gamevault-frontend.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Frontend artifact to unstable release
        if: github.ref == 'refs/heads/develop'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: gamevault-frontend.zip
          asset_name: gamevault-frontend.zip
          tag: unstable
          overwrite: true
          prerelease: true

      - name: Upload Frontend artifact to early-access release
        if: github.ref == 'refs/heads/early-access'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: gamevault-frontend.zip
          asset_name: gamevault-frontend.zip
          tag: early-access
          overwrite: true
          prerelease: true

      - name: Send Discord Notification
        if: github.ref == 'refs/heads/master'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_BOT_WEBHOOK }}
        with:
          args: "<@&1128857090090340382> New Release: {{ EVENT_PAYLOAD.repository.full_name }} v${{ steps.package-version.outputs.current-version }} has been deployed. Here are the changes: https://github.com/{{ EVENT_PAYLOAD.repository.full_name }}/releases/tag/${{ steps.package-version.outputs.current-version }}"

  tauri:
    name: Build Tauri (${{ matrix.platform }})
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve API spec hash
        id: api-spec
        shell: bash
        run: |
          SPEC_FILE="$RUNNER_TEMP/api-spec.yaml"
          curl -fsSL "${{ vars.GV_API_SPEC_URL || 'https://gamevault.alfagun74.de/api/docs-yaml' }}" -o "$SPEC_FILE"
          echo "hash=$(sha256sum "$SPEC_FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "file=$SPEC_FILE" >> "$GITHUB_OUTPUT"

      - name: Cache generated API client
        uses: actions/cache@v4
        with:
          path: src/api
          key: api-${{ steps.api-spec.outputs.hash }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        env:
          GV_API_SPEC_PATH: ${{ steps.api-spec.outputs.file }}
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Validate updater signing configuration
        shell: bash
        env:
          GV_TAURI_UPDATER_PUBKEY: ${{ vars.GV_TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$GV_TAURI_UPDATER_PUBKEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Generate Tauri release config
        env:
          GV_TAURI_UPDATER_PUBKEY: ${{ vars.GV_TAURI_UPDATER_PUBKEY }}
        run: node scripts/write-tauri-release-config.mjs src-tauri/tauri.release.conf.json src-tauri/tauri.release.generated.json

      - name: Write Cargo build version
        run: node scripts/write-cargo-version.mjs src-tauri/Cargo.toml ${{ needs.release.outputs.build_version }}

      - name: Write Debian changelog
        run: node scripts/write-debian-changelog.mjs ${{ needs.release.outputs.build_version }}

      - name: Write AppStream metainfo
        run: node scripts/write-tauri-metainfo.mjs

      - name: Build Tauri stable release
        if: github.ref == 'refs/heads/master'
        env:
          GV_TAURI_UPDATER_PUBKEY: ${{ vars.GV_TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GV_BUILD_VERSION: ${{ needs.release.outputs.build_version }}
          GV_BUILD_CHANNEL: ${{ needs.release.outputs.build_channel }}
          GV_BUILD_COMMIT: ${{ needs.release.outputs.build_commit }}
          GV_BUILD_ID: ${{ needs.release.outputs.build_id }}
          GV_RELEASE_REF: ${{ needs.release.outputs.release_ref }}
        run: pnpm tauri build --config src-tauri/tauri.release.generated.json

      - name: Build Tauri unstable release
        if: github.ref == 'refs/heads/develop'
        env:
          GV_TAURI_UPDATER_PUBKEY: ${{ vars.GV_TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GV_BUILD_VERSION: ${{ needs.release.outputs.build_version }}
          GV_BUILD_CHANNEL: ${{ needs.release.outputs.build_channel }}
          GV_BUILD_COMMIT: ${{ needs.release.outputs.build_commit }}
          GV_BUILD_ID: ${{ needs.release.outputs.build_id }}
          GV_RELEASE_REF: ${{ needs.release.outputs.release_ref }}
        run: pnpm tauri build --config src-tauri/tauri.release.generated.json

      - name: Build Tauri early-access release
        if: github.ref == 'refs/heads/early-access'
        env:
          GV_TAURI_UPDATER_PUBKEY: ${{ vars.GV_TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GV_BUILD_VERSION: ${{ needs.release.outputs.build_version }}
          GV_BUILD_CHANNEL: ${{ needs.release.outputs.build_channel }}
          GV_BUILD_COMMIT: ${{ needs.release.outputs.build_commit }}
          GV_BUILD_ID: ${{ needs.release.outputs.build_id }}
          GV_RELEASE_REF: ${{ needs.release.outputs.release_ref }}
        run: pnpm tauri build --config src-tauri/tauri.release.generated.json

      - name: Prepare Tauri release assets
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/early-access'
        run: node scripts/prepare-tauri-release-assets.mjs ${{ matrix.platform }} ${{ needs.release.outputs.build_version }}

      - name: Upload Tauri release assets
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.version }}" release-assets/${{ matrix.platform }}/* --clobber

      - name: Upload unstable Tauri release assets
        if: github.ref == 'refs/heads/develop'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload unstable release-assets/${{ matrix.platform }}/* --clobber

      - name: Upload early-access Tauri release assets
        if: github.ref == 'refs/heads/early-access'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload early-access release-assets/${{ matrix.platform }}/* --clobber

      - name: Upload updater metadata artifact
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/early-access'
        uses: actions/upload-artifact@v4
        with:
          name: updater-metadata-${{ matrix.platform }}
          path: updater-metadata/${{ matrix.platform }}.json

  cleanup-release:
    name: Clean stale release assets
    needs: [release, tauri, updater-manifest]
    # Run even if a platform build fails or the manifest isn't published, so
    # partially uploaded prerelease assets still get cleaned up (while keeping
    # assets still referenced by the published updater feed).
    if: ${{ !cancelled() && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/early-access') && needs.updater-manifest.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean prerelease release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            target_tag=unstable
          else
            target_tag=early-access
          fi
          node scripts/cleanup-release-assets.mjs "${{ github.repository }}" "$target_tag" --keep-version "${{ needs.release.outputs.build_version }}"

  updater-manifest:
    name: Publish updater manifest
    needs: [release, tauri]
    if: ${{ !cancelled() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/early-access') && needs.release.result == 'success' && needs.tauri.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Download updater metadata
        uses: actions/download-artifact@v4
        with:
          pattern: updater-metadata-*
          path: updater-metadata
          merge-multiple: true

      - name: Determine updater manifest target
        id: manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "file=latest.json" >> "$GITHUB_OUTPUT"
            echo "tag=${{ needs.release.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "asset_tag=${{ needs.release.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channels_tag=${{ needs.release.outputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/early-access" ]; then
            echo "channel=early-access" >> "$GITHUB_OUTPUT"
            echo "file=early-access.json" >> "$GITHUB_OUTPUT"
            echo "tag=early-access" >> "$GITHUB_OUTPUT"
            echo "asset_tag=early-access" >> "$GITHUB_OUTPUT"
            stable_tag=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || true)
            if [ -n "$stable_tag" ]; then
              echo "channels_tag=$stable_tag" >> "$GITHUB_OUTPUT"
            else
              echo "channels_tag=early-access" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "channel=unstable" >> "$GITHUB_OUTPUT"
            echo "file=unstable.json" >> "$GITHUB_OUTPUT"
            echo "tag=unstable" >> "$GITHUB_OUTPUT"
            echo "asset_tag=unstable" >> "$GITHUB_OUTPUT"
            stable_tag=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || true)
            if [ -n "$stable_tag" ]; then
              echo "channels_tag=$stable_tag" >> "$GITHUB_OUTPUT"
            else
              echo "channels_tag=unstable" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download existing updater channels source
        shell: bash
        run: |
          rm -f existing-updater-channels.json
          curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/updater-channels.json" -o existing-updater-channels.json || true
          if [ ! -s existing-updater-channels.json ]; then
            curl -fsSL "https://github.com/${{ github.repository }}/releases/download/unstable/updater-channels.json" -o existing-updater-channels.json || true
          fi
          if [ ! -s existing-updater-channels.json ]; then
            curl -fsSL "https://github.com/${{ github.repository }}/releases/download/early-access/updater-channels.json" -o existing-updater-channels.json || true
          fi

      - name: Build current channel manifest
        env:
          GV_BUILD_COMMIT: ${{ needs.release.outputs.build_commit }}
          GV_BUILD_ID: ${{ needs.release.outputs.build_id }}
          GV_BUILD_CHANNEL: ${{ needs.release.outputs.build_channel }}
        run: node scripts/build-tauri-updater-manifest.mjs ${{ needs.release.outputs.build_version }} updater-metadata current-channel.json ${{ github.repository }} ${{ steps.manifest.outputs.asset_tag }}

      - name: Merge updater channels source
        run: node scripts/merge-tauri-updater-channels.mjs existing-updater-channels.json ${{ steps.manifest.outputs.channel }} current-channel.json updater-channels.json

      - name: Extract updater feed for current channel
        run: node scripts/extract-tauri-updater-channel.mjs updater-channels.json ${{ steps.manifest.outputs.channel }} ${{ steps.manifest.outputs.file }}

      - name: Upload updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.manifest.outputs.tag }}" "${{ steps.manifest.outputs.file }}" --clobber

      - name: Upload updater channels source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.manifest.outputs.channels_tag }}" updater-channels.json --clobber
