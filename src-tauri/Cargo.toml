[package]
name = "app"
version = "17.0.0"
description = "A Tauri App"
authors = ["Phalcode"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
semver = "1"
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
sevenz-rust2 = { version = "0.20.2", features = ["aes256"] }
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "time", "sync", "macros"] }
futures-util = "0.3.31"
sysinfo = "0.33"
zip = "2.4.2"
url = "2"
urlencoding = "2.1.3"
unrar = "0.5.8"
tar = "0.4.44"
flate2 = "1.1.2"
bzip2 = "0.5.2"
xz2 = "0.1.7"
zstd = "0.13.3"
iso9660_simple = "0.2.7"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "shellapi", "winnt", "winuser"] }
